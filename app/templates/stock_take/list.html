{% extends "base.html" %}
{% block page_title %}{% endblock %}

{% block title %}盘点任务管理{% endblock %}

{% block extra_css %}
<style>
.stat-card { border-radius: 10px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.stat-number { font-size: 28px; font-weight: 700; }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.status-pending { background: #e9ecef; color: #495057; }
.status-in_progress { background: #cff4fc; color: #055160; }
.status-counting { background: #fff3cd; color: #664d03; }
.status-completed { background: #d1e7dd; color: #0f5132; }
.status-cancelled { background: #f8d7da; color: #842029; }
.filter-bar { background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.clickable-row { cursor: pointer; }
.clickable-row:hover { background: #f0f4ff !important; }
.progress { height: 6px; border-radius: 3px; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4><i class="fas fa-clipboard-check me-2"></i>盘点任务管理</h4>
        <div class="d-flex gap-2">
            <a href="{{ url_for('stock_take_pages.adjustments_page') }}" class="btn btn-outline-info btn-sm">
                <i class="fas fa-list-alt me-1"></i>调整单
            </a>
            <a href="{{ url_for('stock_take_pages.new_page') }}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>新建盘点
            </a>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="row mb-3" id="statsRow">
        <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center py-2"><div class="stat-number text-info" id="statTotal">-</div><small class="text-muted">总计</small></div></div></div>
        <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center py-2"><div class="stat-number text-secondary" id="statPending">-</div><small class="text-muted">待开始</small></div></div></div>
        <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center py-2"><div class="stat-number text-warning" id="statInProgress">-</div><small class="text-muted">进行中</small></div></div></div>
        <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center py-2"><div class="stat-number text-success" id="statCompleted">-</div><small class="text-muted">已完成</small></div></div></div>
        <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center py-2"><div class="stat-number text-danger" id="statDiff">-</div><small class="text-muted">差异项</small></div></div></div>
        <div class="col-md-2"><div class="card stat-card"><div class="card-body text-center py-2"><div class="stat-number text-primary" id="statAccuracy">-</div><small class="text-muted">准确率</small></div></div></div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small mb-1">状态</label>
                <select class="form-select form-select-sm" id="filterStatus">
                    <option value="">全部</option>
                    <option value="pending">待开始</option>
                    <option value="in_progress">进行中</option>
                    <option value="completed">已完成</option>
                    <option value="cancelled">已取消</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1">盘点类型</label>
                <select class="form-select form-select-sm" id="filterType">
                    <option value="">全部</option>
                    <option value="full">全面盘点</option>
                    <option value="partial">部分盘点</option>
                    <option value="cycle">循环盘点</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">关键词</label>
                <input type="text" class="form-control form-control-sm" id="filterKeyword" placeholder="盘点单号...">
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary btn-sm me-1" onclick="loadTasks(1)"><i class="fas fa-search me-1"></i>查询</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()"><i class="fas fa-redo me-1"></i>重置</button>
            </div>
        </div>
    </div>

    <!-- 表格 -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>盘点单号</th>
                        <th>盘点类型</th>
                        <th>仓库</th>
                        <th>状态</th>
                        <th>进度</th>
                        <th>盘点人</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"><tr><td colspan="8" class="text-center py-4 text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" id="paginationBar"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const STATUS_LABELS = { pending: '待开始', in_progress: '进行中', counting: '盘点中', completed: '已完成', cancelled: '已取消' };
const TYPE_LABELS = { full: '全面盘点', partial: '部分盘点', cycle: '循环盘点' };

async function loadTasks(page = 1) {
    const params = new URLSearchParams({ page, per_page: 15 });
    const status = document.getElementById('filterStatus').value;
    const type = document.getElementById('filterType').value;
    const keyword = document.getElementById('filterKeyword').value;
    if (status) params.set('status', status);
    if (type) params.set('type', type);
    if (keyword) params.set('keyword', keyword);

    try {
        const res = await fetch(`/api/stock-take/tasks?${params}`);
        const data = await res.json();
        if (data.success && data.data) {
            const tasks = data.data.tasks || data.data.items || [];
            renderTable(tasks);
            renderPagination(data.data.pagination || {}, page);
            loadStats();
        }
    } catch(e) { console.error('加载盘点任务失败:', e); }
}

function renderTable(tasks) {
    const tbody = document.getElementById('tableBody');
    if (!tasks.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">暂无盘点任务</td></tr>';
        return;
    }
    tbody.innerHTML = tasks.map(t => {
        const progress = t.total_items ? Math.round((t.counted_items || 0) / t.total_items * 100) : 0;
        return `
        <tr class="clickable-row" onclick="location.href='/stock-takes/${t.id}'">
            <td><strong class="text-primary">${esc(t.task_code || t.code || t.id)}</strong></td>
            <td>${TYPE_LABELS[t.stock_take_type || t.type] || t.stock_take_type || t.type || '-'}</td>
            <td>${esc(t.warehouse_name || '-')}</td>
            <td><span class="status-badge status-${t.status}">${STATUS_LABELS[t.status] || t.status}</span></td>
            <td style="min-width:120px;">
                <div class="d-flex align-items-center gap-2">
                    <div class="progress flex-grow-1"><div class="progress-bar bg-success" style="width:${progress}%"></div></div>
                    <small class="text-muted">${t.counted_items || 0}/${t.total_items || 0}</small>
                </div>
            </td>
            <td>${esc(t.assignee_names || '-')}</td>
            <td><small>${t.created_at ? t.created_at.substring(0,10) : '-'}</small></td>
            <td>
                <div class="btn-group btn-group-sm">
                    <a href="/stock-takes/${t.id}" class="btn btn-outline-primary btn-sm" onclick="event.stopPropagation()"><i class="fas fa-eye"></i></a>
                    ${t.status === 'pending' || t.status === 'in_progress' ? `<a href="/stock-takes/${t.id}/execute" class="btn btn-outline-success btn-sm" onclick="event.stopPropagation()"><i class="fas fa-play"></i></a>` : ''}
                </div>
            </td>
        </tr>`;
    }).join('');
}

function renderPagination(pagination, currentPage) {
    const bar = document.getElementById('paginationBar');
    const pages = pagination.pages || 1;
    const total = pagination.total || 0;
    if (pages <= 1) { bar.innerHTML = ''; return; }
    let html = `<small class="text-muted">共 ${total} 条</small><ul class="pagination pagination-sm mb-0">`;
    html += `<li class="page-item ${currentPage <= 1 ? 'disabled' : ''}"><a class="page-link" href="javascript:void(0)" onclick="loadTasks(${currentPage-1})">&laquo;</a></li>`;
    for (let p = 1; p <= pages; p++) {
        if (pages > 7 && p > 2 && p < currentPage - 1 && p > 3) continue;
        if (pages > 7 && p < pages - 1 && p > currentPage + 1 && p < pages - 2) continue;
        html += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" href="javascript:void(0)" onclick="loadTasks(${p})">${p}</a></li>`;
    }
    html += `<li class="page-item ${currentPage >= pages ? 'disabled' : ''}"><a class="page-link" href="javascript:void(0)" onclick="loadTasks(${currentPage+1})">&raquo;</a></li></ul>`;
    bar.innerHTML = html;
}

async function loadStats() {
    try {
        const res = await fetch('/api/stock-take/stats');
        const data = await res.json();
        if (data.success && data.data) {
            const s = data.data;
            document.getElementById('statTotal').textContent = s.total || 0;
            document.getElementById('statPending').textContent = s.pending || 0;
            document.getElementById('statInProgress').textContent = s.in_progress || 0;
            document.getElementById('statCompleted').textContent = s.completed || 0;
            document.getElementById('statDiff').textContent = s.with_diff || s.diff_count || 0;
            document.getElementById('statAccuracy').textContent = s.accuracy ? s.accuracy + '%' : '-';
        }
    } catch(e) { console.error('加载统计失败:', e); }
}

function resetFilters() {
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterType').value = '';
    document.getElementById('filterKeyword').value = '';
    loadTasks(1);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.addEventListener('DOMContentLoaded', () => loadTasks(1));
</script>
{% endblock %}

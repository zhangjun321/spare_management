{% extends "base.html" %}
{% block page_title %}{% endblock %}

{% block title %}调整单管理{% endblock %}

{% block extra_css %}
<style>
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.status-pending { background: #fff3cd; color: #664d03; }
.status-approved { background: #d1e7dd; color: #0f5132; }
.status-rejected { background: #f8d7da; color: #842029; }
.status-applied { background: #cfe2ff; color: #084298; }
.filter-bar { background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>
            <a href="{{ url_for('stock_take_pages.list_page') }}" class="text-decoration-none me-2">&larr;</a>
            调整单管理
        </h4>
    </div>

    <div class="filter-bar">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small mb-1">状态</label>
                <select class="form-select form-select-sm" id="filterStatus">
                    <option value="">全部</option>
                    <option value="pending">待审批</option>
                    <option value="approved">已审批</option>
                    <option value="rejected">已拒绝</option>
                    <option value="applied">已执行</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary btn-sm me-1" onclick="loadAdjustments(1)"><i class="fas fa-search me-1"></i>查询</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()"><i class="fas fa-redo me-1"></i>重置</button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>调整单号</th>
                        <th>盘点单号</th>
                        <th>调整类型</th>
                        <th>备件数量</th>
                        <th>状态</th>
                        <th>创建人</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"><tr><td colspan="8" class="text-center py-4 text-muted">加载中...</td></tr></tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" id="paginationBar"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const STATUS_LABELS = { pending: '待审批', approved: '已审批', rejected: '已拒绝', applied: '已执行' };
const ADJ_TYPE_LABELS = {
    inventory_gain: '盘盈入库', inventory_loss: '盘亏出库',
    damage: '报损', correction: '修正'
};

async function loadAdjustments(page = 1) {
    const params = new URLSearchParams({ page, per_page: 15 });
    const status = document.getElementById('filterStatus').value;
    if (status) params.set('status', status);

    try {
        const res = await fetch(`/api/stock-take/adjustments?${params}`);
        const data = await res.json();
        if (data.success && data.data) {
            renderTable(data.data.items || []);
            renderPagination(data.data, page);
        }
    } catch(e) { console.error('加载调整单失败:', e); }
}

function renderTable(items) {
    const tbody = document.getElementById('tableBody');
    if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">暂无调整单</td></tr>';
        return;
    }
    tbody.innerHTML = items.map(a => `
        <tr>
            <td><strong class="text-primary">${esc(a.adjustment_code || a.code || a.id)}</strong></td>
            <td><small>${esc(a.task_code || a.stock_take_code || '-')}</small></td>
            <td>${ADJ_TYPE_LABELS[a.adjustment_type || a.type] || a.adjustment_type || a.type || '-'}</td>
            <td>${a.item_count || a.items_count || 0}</td>
            <td><span class="status-badge status-${a.status}">${STATUS_LABELS[a.status] || a.status}</span></td>
            <td>${esc(a.created_by_name || '-')}</td>
            <td><small>${a.created_at ? a.created_at.substring(0,10) : '-'}</small></td>
            <td>
                ${a.status === 'pending' ? `
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-success btn-sm" onclick="handleAdjust(${a.id}, 'approve')"><i class="fas fa-check me-1"></i>通过</button>
                    <button class="btn btn-danger btn-sm" onclick="handleAdjust(${a.id}, 'reject')"><i class="fas fa-times me-1"></i>拒绝</button>
                </div>` : '<small class="text-muted">-</small>'}
            </td>
        </tr>
    `).join('');
}

function renderPagination(pagination, currentPage) {
    const bar = document.getElementById('paginationBar');
    const pages = pagination.pages || 1;
    const total = pagination.total || 0;
    if (pages <= 1) { bar.innerHTML = ''; return; }
    let html = `<small class="text-muted">共 ${total} 条</small><ul class="pagination pagination-sm mb-0">`;
    html += `<li class="page-item ${currentPage <= 1 ? 'disabled' : ''}"><a class="page-link" href="javascript:void(0)" onclick="loadAdjustments(${currentPage-1})">&laquo;</a></li>`;
    for (let p = 1; p <= pages; p++) {
        if (pages > 7 && p > 2 && p < currentPage - 1 && p > 3) continue;
        if (pages > 7 && p < pages - 1 && p > currentPage + 1 && p < pages - 2) continue;
        html += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" href="javascript:void(0)" onclick="loadAdjustments(${p})">${p}</a></li>`;
    }
    html += `<li class="page-item ${currentPage >= pages ? 'disabled' : ''}"><a class="page-link" href="javascript:void(0)" onclick="loadAdjustments(${currentPage+1})">&raquo;</a></li></ul>`;
    bar.innerHTML = html;
}

async function handleAdjust(id, action) {
    const reason = action === 'reject' ? prompt('请输入拒绝原因:') : '';
    if (action === 'reject' && reason === null) return;
    if (!confirm(`确认${action === 'approve' ? '通过' : '拒绝'}此调整单？`)) return;

    try {
        const res = await fetch(`/api/stock-take/adjustments/${id}/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason || '' })
        });
        const data = await res.json();
        if (data.success) { alert('操作成功'); loadAdjustments(); }
        else { alert('操作失败: ' + (data.message || '未知错误')); }
    } catch(e) { alert('网络错误'); }
}

function resetFilters() {
    document.getElementById('filterStatus').value = '';
    loadAdjustments(1);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.addEventListener('DOMContentLoaded', () => loadAdjustments(1));
</script>
{% endblock %}

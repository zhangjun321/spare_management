{% extends "base.html" %}
{% block page_title %}{% endblock %}

{% block title %}调拨单详情{% endblock %}

{% block extra_css %}
<style>
.detail-card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.detail-card h6 { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 14px; font-weight: 600; }
.detail-table th { width: 120px; color: #666; font-size: 13px; }
.detail-table td { font-size: 14px; }
.status-badge {
    display: inline-block; padding: 4px 14px; border-radius: 14px; font-size: 13px; font-weight: 500;
}
.status-draft { background: #e9ecef; color: #495057; }
.status-submitted { background: #cff4fc; color: #055160; }
.status-approved { background: #d1e7dd; color: #0f5132; }
.status-in_transit { background: #fff3cd; color: #664d03; }
.status-received { background: #cfe2ff; color: #084298; }
.status-completed { background: #d1e7dd; color: #0f5132; }
.status-rejected { background: #f8d7da; color: #842029; }
.status-cancelled { background: #e2e3e5; color: #41464b; }
.timeline { position: relative; padding-left: 28px; }
.timeline::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 2px; background: #dee2e6; }
.timeline-item { position: relative; margin-bottom: 16px; }
.timeline-dot { position: absolute; left: -22px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #0d6efd; border: 2px solid #fff; box-shadow: 0 0 0 2px #0d6efd; }
.timeline-dot.draft { background: #6c757d; box-shadow: 0 0 0 2px #6c757d; }
.timeline-dot.completed { background: #198754; box-shadow: 0 0 0 2px #198754; }
.timeline-dot.rejected { background: #dc3545; box-shadow: 0 0 0 2px #dc3545; }
.timeline-content { font-size: 13px; }
.timeline-time { color: #999; font-size: 12px; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>
            <a href="{{ url_for('transfer_order_pages.list_page') }}" class="text-decoration-none me-2">&larr;</a>
            调拨单详情
        </h4>
        <div id="actionButtons" class="d-flex gap-2"></div>
    </div>

    <div id="loadingBlock" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">加载中...</p></div>

    <div id="detailContent" style="display:none;">
        <div class="row">
            <div class="col-md-8">
                <!-- 基本信息 -->
                <div class="detail-card">
                    <h6><i class="fas fa-info-circle me-2"></i>基本信息</h6>
                    <table class="table table-sm detail-table mb-0">
                        <tr><th>调拨单号</th><td><strong id="dOrderCode">-</strong></td></tr>
                        <tr><th>状态</th><td><span id="dStatus" class="status-badge">-</span></td></tr>
                        <tr><th>调拨类型</th><td id="dTransferType">-</td></tr>
                        <tr><th>调出仓库</th><td id="dFromWh">-</td></tr>
                        <tr><th>目标仓库</th><td id="dToWh">-</td></tr>
                        <tr><th>创建人</th><td id="dCreatedBy">-</td></tr>
                        <tr><th>创建时间</th><td id="dCreatedAt">-</td></tr>
                        <tr><th>备注</th><td id="dRemark" class="text-muted">-</td></tr>
                    </table>
                </div>

                <!-- 商品明细 -->
                <div class="detail-card">
                    <h6><i class="fas fa-boxes me-2"></i>调拨明细</h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover">
                            <thead class="table-light">
                                <tr><th>备件名称</th><th>备件代码</th><th>数量</th><th>单位</th><th>备注</th></tr>
                            </thead>
                            <tbody id="itemsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <!-- 操作日志 -->
                <div class="detail-card">
                    <h6><i class="fas fa-history me-2"></i>操作日志</h6>
                    <div class="timeline" id="timeline"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const STATUS_LABELS = {
    draft: '草稿', submitted: '待审批', approved: '已审批',
    in_transit: '运输中', received: '待接收', completed: '已完成',
    rejected: '已拒绝', cancelled: '已取消'
};

let currentOrder = null;

async function loadDetail() {
    try {
        const res = await fetch(`/api/transfer-orders/{{ order_id }}`);
        const data = await res.json();
        if (!data.success || !data.data) { document.getElementById('loadingBlock').innerHTML = '<p class="text-danger py-5">未找到调拨单</p>'; return; }
        currentOrder = data.data;
        renderDetail(currentOrder);
        document.getElementById('loadingBlock').style.display = 'none';
        document.getElementById('detailContent').style.display = 'block';
    } catch(e) {
        document.getElementById('loadingBlock').innerHTML = '<p class="text-danger py-5">加载失败: ' + e.message + '</p>';
    }
}

function renderDetail(o) {
    const s = o.status;
    document.getElementById('dOrderCode').textContent = o.order_code;
    document.getElementById('dStatus').textContent = STATUS_LABELS[s] || s;
    document.getElementById('dStatus').className = 'status-badge status-' + s;
    document.getElementById('dTransferType').textContent = ({ inter_warehouse: '跨仓库调拨', return_to_supplier: '退货供应商', internal_adjustment: '内部调整' })[o.transfer_type] || o.transfer_type || '-';
    document.getElementById('dFromWh').textContent = o.from_warehouse_name || '-';
    document.getElementById('dToWh').textContent = o.to_warehouse_name || '-';
    document.getElementById('dCreatedBy').textContent = o.created_by_name || '-';
    document.getElementById('dCreatedAt').textContent = o.created_at || '-';
    document.getElementById('dRemark').textContent = o.remark || '无';

    // 商品明细
    const items = o.items || [];
    document.getElementById('itemsTable').innerHTML = items.length
        ? items.map(i => `<tr><td>${esc(i.spare_part_name || '-')}</td><td><code>${esc(i.spare_part_code || '-')}</code></td><td>${i.quantity}</td><td>${esc(i.unit || '-')}</td><td>${esc(i.remark || '-')}</td></tr>`).join('')
        : '<tr><td colspan="5" class="text-muted text-center">无明细</td></tr>';

    // 操作按钮
    renderActionButtons(o);

    // 时间线
    renderTimeline(o);
}

function renderActionButtons(o) {
    const btns = document.getElementById('actionButtons');
    let html = '';
    if (o.status === 'draft') {
        html += `<a href="/transfer-orders/{{ order_id }}/edit" class="btn btn-outline-secondary btn-sm"><i class="fas fa-edit me-1"></i>编辑</a>`;
        html += `<button class="btn btn-primary btn-sm" onclick="doTransit('submitted')"><i class="fas fa-paper-plane me-1"></i>提交审批</button>`;
    }
    if (o.status === 'submitted') {
        html += `<button class="btn btn-success btn-sm" onclick="doTransit('approved')"><i class="fas fa-check me-1"></i>审批通过</button>`;
        html += `<button class="btn btn-danger btn-sm" onclick="doTransit('cancel')"><i class="fas fa-times me-1"></i>拒绝/取消</button>`;
    }
    if (o.status === 'approved') {
        html += `<button class="btn btn-info btn-sm" onclick="doTransit('ship')"><i class="fas fa-truck me-1"></i>发货</button>`;
    }
    if (o.status === 'in_transit') {
        html += `<button class="btn btn-primary btn-sm" onclick="doTransit('receive')"><i class="fas fa-box-open me-1"></i>确认收货</button>`;
    }
    if (o.status === 'received') {
        html += `<button class="btn btn-success btn-sm" onclick="doTransit('complete')"><i class="fas fa-check-double me-1"></i>完成</button>`;
    }
    btns.innerHTML = html;
}

async function doTransit(target) {
    if (target === 'cancel') {
        const reason = prompt('请输入取消原因:');
        if (reason === null) return;
    }
    if (!confirm(`确认执行此操作？`)) return;

    try {
        const body = { target: target };
        const res = await fetch(`/api/transfer-orders/{{ order_id }}/transit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) { alert('操作成功'); loadDetail(); }
        else { alert('操作失败: ' + (data.message || '未知错误')); }
    } catch(e) { alert('网络错误'); }
}

async function doAction(action, needReason) {
    let reason = '';
    if (needReason) { reason = prompt('请输入原因:'); if (reason === null) return; }
    if (!needReason && !confirm(`确认执行此操作？`)) return;

    try {
        const res = await fetch(`/api/transfer-orders/{{ order_id }}/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason || '' })
        });
        const data = await res.json();
        if (data.success) { alert('操作成功'); loadDetail(); }
        else { alert('操作失败: ' + (data.message || '未知错误')); }
    } catch(e) { alert('网络错误'); }
}

function renderTimeline(o) {
    const timeline = document.getElementById('timeline');
    const logs = o.logs || [];
    const defaultLogs = [
        { status: 'draft', action: o.status === 'draft' ? '创建' : '已创建', created_at: o.created_at, operator: o.created_by_name }
    ];
    const allLogs = logs.length ? logs : defaultLogs;
    timeline.innerHTML = allLogs.map(l => `
        <div class="timeline-item">
            <div class="timeline-dot ${l.status || 'draft'}"></div>
            <div class="timeline-content">
                <strong>${STATUS_LABELS[l.status] || l.action || '操作'}</strong>
                <span class="text-muted ms-1">- ${esc(l.operator || '-')}</span>
                ${l.remark ? `<div class="text-muted small">${esc(l.remark)}</div>` : ''}
                <div class="timeline-time">${l.created_at || '-'}</div>
            </div>
        </div>
    `).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.addEventListener('DOMContentLoaded', loadDetail);
</script>
{% endblock %}
